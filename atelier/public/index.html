<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cap Web, tri des déchets</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Cap Web</h1>
    <p class="intro">Votre assistant pour bien trier, trouver la déchetterie et réduire vos déchets.</p>

    <ul id="messages"></ul>

    <form id="chat-form">
      <label for="message">Votre message</label>
      <textarea id="message" name="message" rows="3"></textarea>
      <button type="submit">Envoyer</button>
    </form>

    <ul id="suggestions">
      <li><button type="button">Astuces de réutilisation.</button></li>
      <li><button type="button">Quel type de conteneur collecte telle ordure ?</button></li>
      <li><button type="button">Quel sont les jours de ramassage dans mon quartier ?</button></li>
    </ul>

    <p id="status" role="status"></p>

    <button type="button" id="effacer">Effacer la conversation</button>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
