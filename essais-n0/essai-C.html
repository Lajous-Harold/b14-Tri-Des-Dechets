<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriMalin, chatbot IA</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fafafa; margin: 0; padding: 20px; }
    .wrap { max-width: 700px; margin: 0 auto; }
    h1 { color: #2e7d32; }
    .key-box { background: #fff3e0; border: 1px solid #ffb74d; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
    .key-box input { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; }
    #log { background: white; border: 1px solid #ddd; border-radius: 8px; height: 380px; overflow-y: auto; padding: 12px; }
    .line { margin: 8px 0; line-height: 1.4; }
    .line.user strong { color: #1565c0; }
    .line.bot strong { color: #2e7d32; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .row input { flex: 1; padding: 10px; }
    .row button { padding: 10px 18px; background: #2e7d32; color: white; border: none; border-radius: 6px; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TriMalin</h1>
    <p>Un assistant intelligent propulsé par l'IA pour répondre à toutes tes questions sur le tri des déchets.</p>

    <div class="key-box">
      <label for="apiKey">Ta clé API OpenAI (elle reste dans ton navigateur) :</label>
      <input type="password" id="apiKey" placeholder="sk-...">
    </div>

    <div id="log"></div>

    <div class="row">
      <input type="text" id="question" placeholder="Ex : où jeter une boîte de pizza ?">
      <button id="ask">Envoyer</button>
    </div>
  </div>

  <script>
    const log = document.getElementById("log");
    const conversation = [
      { role: "system", content: "Tu es TriMalin, un assistant expert du tri des déchets en France. Réponds simplement, en 3 phrases maximum." }
    ];

    function write(who, text, cls) {
      const p = document.createElement("p");
      p.className = "line " + cls;
      p.innerHTML = "<strong>" + who + " :</strong> " + text;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    }

    async function ask() {
      const key = document.getElementById("apiKey").value.trim();
      const input = document.getElementById("question");
      const q = input.value.trim();
      if (!q) return;
      if (!key) {
        write("TriMalin", "Veuillez entrer votre clé API OpenAI pour utiliser le chatbot.", "bot error");
        return;
      }
      write("Toi", q, "user");
      input.value = "";
      conversation.push({ role: "user", content: q });
      try {
        const res = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
          body: JSON.stringify({ model: "gpt-4o-mini", messages: conversation })
        });
        const data = await res.json();
        const text = data.choices[0].message.content;
        conversation.push({ role: "assistant", content: text });
        write("TriMalin", text, "bot");
      } catch (err) {
        write("TriMalin", "Erreur : " + err.message, "bot error");
      }
    }

    document.getElementById("ask").addEventListener("click", ask);
    document.getElementById("question").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

    write("TriMalin", "Bonjour ! Entre ta clé API ci-dessus, puis pose-moi ta question sur le tri.", "bot");
  </script>
</body>
</html>
