<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éco-Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #a8e063, #56ab2f);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bot-window {
      width: 90%;
      max-width: 480px;
      height: 85vh;
      background: #fff;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .top { padding: 14px; background: #56ab2f; color: white; border-radius: 16px 16px 0 0; font-weight: bold; }
    .messages { flex: 1; overflow-y: auto; padding: 14px; }
    .bubble { padding: 9px 13px; margin: 6px 0; border-radius: 14px; width: fit-content; max-width: 80%; }
    .me { background: #dcf8c6; margin-left: auto; }
    .eco { background: #eee; }
    .typing { font-style: italic; color: #888; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; }
    .chip { border: 1px solid #56ab2f; background: white; color: #56ab2f; border-radius: 20px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
    .bottom { display: flex; padding: 10px; border-top: 1px solid #eee; }
    .bottom input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
    .bottom button { margin-left: 8px; padding: 10px 16px; border-radius: 20px; border: none; background: #56ab2f; color: white; }
  </style>
</head>
<body>
  <div class="bot-window">
    <div class="top">Éco-Assistant</div>
    <div class="messages" id="messages"></div>
    <div class="chips">
      <button class="chip" onclick="quick('verre')">Verre</button>
      <button class="chip" onclick="quick('plastique')">Plastique</button>
      <button class="chip" onclick="quick('compost')">Compost</button>
      <button class="chip" onclick="quick('déchetterie')">Déchetterie</button>
    </div>
    <div class="bottom">
      <input id="msg" placeholder="Écris ton message...">
      <button onclick="send()">Envoyer</button>
    </div>
  </div>
  <script>
    const knowledge = {
      verre: "<b>Verre</b> : conteneur à verre, sans bouchon ni couvercle.",
      plastique: "<b>Plastique</b> : tous les emballages vont dans le bac jaune.",
      compost: "<b>Compost</b> : épluchures, marc de café, coquilles d'œufs.",
      "déchetterie": "<b>Déchetterie</b> : encombrants, gravats, déchets verts, produits toxiques.",
      papier: "<b>Papier</b> : bac jaune ou bleu selon ta ville.",
      piles: "<b>Piles</b> : bornes de collecte en magasin."
    };

    const box = document.getElementById("messages");

    function bubble(html, cls) {
      const d = document.createElement("div");
      d.className = "bubble " + cls;
      d.innerHTML = html;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
      return d;
    }

    function answer(q) {
      q = q.toLowerCase();
      for (let k in knowledge) if (q.indexOf(k) !== -1) return knowledge[k];
      return "Hmm, je ne suis pas sûr. Clique sur un des boutons ci-dessous !";
    }

    function send() {
      const input = document.getElementById("msg");
      const q = input.value;
      bubble(q, "me");
      input.value = "";
      const t = bubble("Éco-Assistant écrit...", "eco typing");
      setTimeout(() => { t.remove(); bubble(answer(q), "eco"); }, 800);
    }

    function quick(word) {
      document.getElementById("msg").value = word;
      send();
    }

    document.getElementById("msg").addEventListener("keydown", e => {
      if (e.key === "Enter") send();
    });

    bubble("Salut ! Je suis l'Éco-Assistant. Je t'aide à trier tes déchets. Que veux-tu savoir ?", "eco");
  </script>
</body>
</html>
